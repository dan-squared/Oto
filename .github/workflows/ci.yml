name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use installed Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Oto
      - name: Build and test
        run: xcodebuild test -scheme Oto -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    env:
      OTO_FEED_URL: ${{ vars.OTO_FEED_URL }}
      SPARKLE_KEY_FILE: ${{ secrets.SPARKLE_KEY_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Use installed Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Oto
      - name: Build ad-hoc release + signed appcast
        run: ./Scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oto-beta
          path: |
            build/release/Oto.app
            updates/*.zip
            site/public/appcast.xml
